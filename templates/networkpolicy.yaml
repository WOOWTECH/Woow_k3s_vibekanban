{{- if .Values.networkPolicies.enabled }}
---
# PostgreSQL: only remote, relay, and electric can connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vk-db-policy
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app: vk-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: vk-remote
        - podSelector:
            matchLabels:
              app: vk-relay
        - podSelector:
            matchLabels:
              app: vk-electric
      ports:
        - port: 5432
---
# Remote server: accessible from cloudflared and within namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vk-remote-policy
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app: vk-remote
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8081
---
# Relay: accessible from cloudflared and host
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vk-relay-policy
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app: vk-relay
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8082
---
# ElectricSQL: only remote can access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vk-electric-policy
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app: vk-electric
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: vk-remote
      ports:
        - port: 3000
{{- end }}
