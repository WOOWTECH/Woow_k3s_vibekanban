---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-relay
  namespace: {{ .Values.namespace.name }}
  labels:
    app: vk-relay
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-relay
  template:
    metadata:
      labels:
        app: vk-relay
    spec:
      {{- include "vibekanban.nodeSelector" . | nindent 6 }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z vk-db-svc 5432; do
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: relay
          image: "{{ .Values.relay.image.repository }}:{{ .Values.relay.image.tag }}"
          imagePullPolicy: {{ .Values.relay.image.pullPolicy }}
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: RUST_LOG
              value: "info,relay=info"
            - name: RELAY_LISTEN_ADDR
              value: "0.0.0.0:8082"
            - name: SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: SERVER_DATABASE_URL
            - name: VIBEKANBAN_REMOTE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: VIBEKANBAN_REMOTE_JWT_SECRET
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
