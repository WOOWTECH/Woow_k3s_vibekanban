---
apiVersion: v1
kind: Service
metadata:
  name: vk-db-svc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: vk-db
spec:
  selector:
    app: vk-db
  ports:
    - name: postgres
      protocol: TCP
      port: {{ .Values.postgres.service.port }}
      targetPort: 5432
  type: {{ .Values.postgres.service.type }}
