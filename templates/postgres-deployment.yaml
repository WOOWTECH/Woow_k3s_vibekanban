---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-db
  namespace: {{ .Values.namespace.name }}
  labels:
    app: vk-db
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-db
  template:
    metadata:
      labels:
        app: vk-db
    spec:
      {{- include "vibekanban.nodeSelector" . | nindent 6 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          args: ["-c", "wal_level=logical"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "remote"
            - name: POSTGRES_USER
              value: "remote"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "remote", "-d", "remote"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "remote", "-d", "remote"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: vk-db-pvc
