---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-electric
  namespace: {{ .Values.namespace.name }}
  labels:
    app: vk-electric
    app.kubernetes.io/component: sync-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-electric
  template:
    metadata:
      labels:
        app: vk-electric
    spec:
      {{- include "vibekanban.nodeSelector" . | nindent 6 }}
      initContainers:
        - name: wait-for-remote
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for remote-server to complete migrations..."
              until wget --spider -q http://vk-remote-svc:8081/v1/health 2>/dev/null; do
                echo "  remote-server not ready, retrying in 3s..."
                sleep 3
              done
              echo "Remote server is ready (migrations complete, electric_sync role created)!"
      containers:
        - name: electric
          image: "{{ .Values.electric.image.repository }}:{{ .Values.electric.image.tag }}"
          imagePullPolicy: {{ .Values.electric.image.pullPolicy }}
          workingDir: /app
          env:
            - name: ELECTRIC_ROLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: ELECTRIC_ROLE_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: ELECTRIC_DATABASE_URL
            - name: PG_PROXY_PORT
              value: "65432"
            - name: LOGICAL_PUBLISHER_HOST
              value: "vk-electric"
            - name: AUTH_MODE
              value: "insecure"
            - name: ELECTRIC_INSECURE
              value: "true"
            - name: ELECTRIC_MANUAL_TABLE_PUBLISHING
              value: "true"
            - name: ELECTRIC_USAGE_REPORTING
              value: "false"
            - name: ELECTRIC_FEATURE_FLAGS
              value: "allow_subqueries,tagged_subqueries"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: electric-data
              mountPath: /app/persistent
          resources:
            {{- toYaml .Values.electric.resources | nindent 12 }}
      volumes:
        - name: electric-data
          persistentVolumeClaim:
            claimName: vk-electric-pvc
