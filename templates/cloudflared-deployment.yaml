{{- if .Values.cloudflared.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-cloudflared
  namespace: {{ .Values.namespace.name }}
  labels:
    app: vk-cloudflared
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-cloudflared
  template:
    metadata:
      labels:
        app: vk-cloudflared
    spec:
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy }}
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vk-cf-tunnel-secret
                  key: TUNNEL_TOKEN
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
      restartPolicy: Always
{{- end }}
