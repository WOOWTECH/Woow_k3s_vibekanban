{{- if .Values.terminal.enabled }}
# Web terminal (ttyd) for remote access to vk-host container
# Provides browser-based TUI to run claude, opencode, etc.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vk-terminal-sa
  namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vk-terminal-role
  namespace: {{ .Values.namespace.name }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vk-terminal-rb
  namespace: {{ .Values.namespace.name }}
subjects:
  - kind: ServiceAccount
    name: vk-terminal-sa
    namespace: {{ .Values.namespace.name }}
roleRef:
  kind: Role
  name: vk-terminal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vk-terminal-scripts
  namespace: {{ .Values.namespace.name }}
data:
  connect.sh: |
    #!/bin/sh
    # ttyd wrapper: kubectl exec into the vk-host container
    NAMESPACE={{ .Values.namespace.name | quote }}
    LABEL="app=vk-host"
    CONTAINER="host"

    while true; do
      POD=$(kubectl get pod -l "$LABEL" -n "$NAMESPACE" \
        --field-selector=status.phase=Running \
        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
      if [ -n "$POD" ]; then
        echo "Connecting to $POD ..."
        kubectl exec -it "$POD" -n "$NAMESPACE" -c "$CONTAINER" -- bash
        echo ""
        echo "Session ended. Reconnecting in 2s..."
        sleep 2
      else
        echo "Waiting for vk-host pod..."
        sleep 5
      fi
    done

  startup.sh: |
    #!/bin/bash
    # Install ttyd + kubectl at startup
    if [ ! -f /usr/local/bin/ttyd ]; then
      apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
      curl -sLo /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
      chmod +x /usr/local/bin/ttyd
      curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      chmod +x /usr/local/bin/kubectl
    fi
    echo "Starting ttyd on :7681..."
    exec ttyd -p 7681 -c "admin:${TUI_PASSWORD}" -W /scripts/connect.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-terminal
  namespace: {{ .Values.namespace.name }}
  labels:
    app: vk-terminal
    app.kubernetes.io/component: terminal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-terminal
  template:
    metadata:
      labels:
        app: vk-terminal
    spec:
      serviceAccountName: vk-terminal-sa
      containers:
        - name: ttyd
          image: "{{ .Values.terminal.image.repository }}:{{ .Values.terminal.image.tag }}"
          imagePullPolicy: {{ .Values.terminal.image.pullPolicy }}
          command: ["bash", "/scripts/startup.sh"]
          ports:
            - containerPort: 7681
              name: ttyd
          env:
            - name: TUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: SELF_HOST_LOCAL_AUTH_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            {{- toYaml .Values.terminal.resources | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: vk-terminal-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: vk-terminal-svc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: vk-terminal
spec:
  selector:
    app: vk-terminal
  ports:
    - name: ttyd
      protocol: TCP
      port: {{ .Values.terminal.service.port }}
      targetPort: 7681
      {{- if eq .Values.terminal.service.type "NodePort" }}
      nodePort: {{ .Values.terminal.service.nodePort }}
      {{- end }}
  type: {{ .Values.terminal.service.type }}
{{- end }}
