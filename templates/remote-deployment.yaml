---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-remote
  namespace: {{ .Values.namespace.name }}
  labels:
    app: vk-remote
    app.kubernetes.io/component: api-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-remote
  template:
    metadata:
      labels:
        app: vk-remote
    spec:
      {{- include "vibekanban.nodeSelector" . | nindent 6 }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z vk-db-svc 5432; do
                echo "  db not ready, retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: remote
          image: "{{ .Values.remote.image.repository }}:{{ .Values.remote.image.tag }}"
          imagePullPolicy: {{ .Values.remote.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: RUST_LOG
              value: "info,remote=info"
            - name: SERVER_LISTEN_ADDR
              value: "0.0.0.0:8081"
            - name: SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: SERVER_DATABASE_URL
            - name: ELECTRIC_URL
              value: "http://vk-electric-svc:3000"
            - name: ELECTRIC_ROLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: ELECTRIC_ROLE_PASSWORD
            - name: SERVER_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: vk-config
                  key: PUBLIC_BASE_URL
            - name: VIBEKANBAN_REMOTE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: VIBEKANBAN_REMOTE_JWT_SECRET
            - name: SELF_HOST_LOCAL_AUTH_EMAIL
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: SELF_HOST_LOCAL_AUTH_EMAIL
            - name: SELF_HOST_LOCAL_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: SELF_HOST_LOCAL_AUTH_PASSWORD
            - name: GITHUB_OAUTH_CLIENT_ID
              value: ""
            - name: GITHUB_OAUTH_CLIENT_SECRET
              value: ""
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: ""
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              value: ""
          resources:
            {{- toYaml .Values.remote.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
