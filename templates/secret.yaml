---
apiVersion: v1
kind: Secret
metadata:
  name: vk-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: vibe-kanban
type: Opaque
stringData:
  VIBEKANBAN_REMOTE_JWT_SECRET: {{ .Values.secrets.vibekanbanRemoteJwtSecret | quote }}
  ELECTRIC_ROLE_PASSWORD: {{ .Values.secrets.electricRolePassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  SELF_HOST_LOCAL_AUTH_EMAIL: {{ .Values.secrets.selfHostLocalAuthEmail | quote }}
  SELF_HOST_LOCAL_AUTH_PASSWORD: {{ .Values.secrets.selfHostLocalAuthPassword | quote }}
  SERVER_DATABASE_URL: {{ .Values.secrets.serverDatabaseUrl | quote }}
  ELECTRIC_DATABASE_URL: {{ .Values.secrets.electricDatabaseUrl | quote }}
  MINIMAX_API_KEY: {{ .Values.secrets.minimaxApiKey | quote }}
{{- if .Values.cloudflared.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: vk-cf-tunnel-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: vibe-kanban
type: Opaque
stringData:
  TUNNEL_TOKEN: {{ .Values.secrets.cloudflareTunnelToken | quote }}
{{- end }}
